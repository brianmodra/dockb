[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockb"
version = "0.1.0"
description = "Document knowledge graph backend"
authors = [
  { name = "DockB Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "neo4j>=5.19",
  "python-dotenv>=1.0",
  "cachetools>=7.1.3",
  "spacy>=3.8.14",
  "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9",
  "isort>=8.0.1",
  "pytest-freezer>=0.4.9",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dockb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py310"]
line-length = 120

[tool.ruff]
line-length = 120
src = ["src"]
select = ["E", "F", "I", "B", "UP", "C90"]
ignore = []

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
plugins = []
strict = true
mypy_path = "src"

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

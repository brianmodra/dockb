[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockb"
version = "0.1.0"
description = "Document knowledge graph backend"
authors = [
  { name = "DockB Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "neo4j>=5.19",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dockb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.ruff]
line-length = 88
src = ["src"]
select = ["E", "F", "I", "B", "UP", "C90"]
ignore = []

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
plugins = []
strict = true
mypy_path = "src"
